<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleArena Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070a12;
      color: #fff;
    }

    .login-box {
      width: min(420px, 92%);
      margin: 80px auto;
      padding: 30px;
      background: #111827;
      border: 1px solid #263248;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 15px;
    }

    input {
      background: #0b1220;
      color: white;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #dashboard {
      display: none;
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logout {
      width: auto;
      padding: 10px 18px;
      background: #dc2626;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #263248;
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginBox">
    <h1>🎮 BattleArena Admin</h1>
    <p>Admin Login</p>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">LOGIN</button>

    <div id="loginMessage"></div>
  </div>

  <div id="dashboard">

    <div class="topbar">
      <div>
        <h1>BattleArena Admin Dashboard</h1>
        <p id="welcome"></p>
      </div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="status">
      <h2>✅ Admin Panel Connected</h2>
      <p>Supabase authentication is working.</p>
      <p>Next we will add tournament management, players, rooms, results and website settings.</p>
    </div>

  </div>

<script>

const SUPABASE_URL =
  "https://aakdbugxtftyhdfyxyfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_pUMWE4y0iNycqs5i7c-bcQ_T4o8kI58";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  if (!email || !password) {
    message.textContent = "Email और password डालो.";
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent =
      "Login failed: " + error.message;
    return;
  }

  const user = data.user;

  const { data: admin, error: adminError } =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

  if (adminError || !admin) {

    await supabaseClient.auth.signOut();

    message.textContent =
      "यह account admin नहीं है.";

    return;
  }

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  document.getElementById("welcome").textContent =
    "Welcome, Admin 👋 " + user.email;
}


async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginBox").style.display = "block";

  document.getElementById("password").value = "";
}

</script>

</body>
</html>
