<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleArena Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #070a12;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: #111827;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0,0,0,.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .sub {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #0b1220;
      color: white;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #f87171;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>🎮 BattleArena</h1>
    <div class="sub">Admin Panel</div>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" onclick="login()">
      LOGIN
    </button>

    <div id="message"></div>
  </div>

<script>
  const SUPABASE_URL = "https://aakdbugxtftyhdfyxyfr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_pUMWE4y0iNycqs5i7c-bcQ_T4o8kI58";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("loginBtn");

    message.textContent = "";

    if (!email || !password) {
      message.textContent =
        "Email aur password dono bharo.";
      return;
    }

    button.disabled = true;
    button.textContent = "LOGGING IN...";

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error("Login failed.");
      }

      const { data: admin, error: adminError } =
        await supabaseClient
          .from("admins")
          .select("user_id")
          .eq("user_id", data.user.id)
          .maybeSingle();

      if (adminError) {
        await supabaseClient.auth.signOut();
        throw adminError;
      }

      if (!admin) {
        await supabaseClient.auth.signOut();
        throw new Error(
          "Ye account admin nahi hai."
        );
      }

      message.style.color = "#4ade80";
      message.textContent =
        "Login successful!";

      setTimeout(() => {
        showDashboard();
      }, 500);

    } catch (error) {

      console.error(error);

      message.style.color = "#f87171";
      message.textContent =
        error.message || "Login failed.";

      button.disabled = false;
      button.textContent = "LOGIN";
    }
  }

  function showDashboard() {

    document.body.innerHTML = `
      <div style="
        width:100%;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#070a12;
        color:white;
        font-family:Arial;
        text-align:center;
        padding:20px;
      ">
        <div>
          <h1>🎉 Login Successful</h1>
          <p style="color:#9ca3af;">
            BattleArena Admin Panel connected successfully.
          </p>
          <p>
            Next step mein complete Dashboard add karenge.
          </p>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
